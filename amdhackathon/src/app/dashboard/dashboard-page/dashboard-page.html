<div class="dashboard-container">

  <div class="header">
    <h1 class="h1">Dashboard</h1>


  </div>


  <div class="ticket-filtering">
    <label class="filter-label">
      Sort by:
      <select [(ngModel)]="sortOption" (change)="onSortOptionChange($event)">
        <option value="date">Longest Since Open</option>
        <option value="severity">Severity Level (Highest to Lowest)</option>
        <option value="severityAsc">Severity Level (Lowest to Highest)</option>
      </select>
    </label>


    <label class="filter-label">
      Filter by Resolved Status:
      <select [(ngModel)]="resolvedFilter" (change)="onResolvedFilterChange($event)">
        <option value="unresolved">Unresolved</option>
        <option value="resolved">Resolved</option>
        <option value="all">All</option>

      </select>
    </label>

  </div>

  <div class="ticket-description">
    <p>Category</p>
    <p>Description</p>
    <p>Severity</p>
    <p>Time Active</p>
    <p>Date Created</p>
    <p>Team Assigned</p>
  </div>



  <div class="tickets">


    <mat-card *ngFor="let ticket of filteredTickets$ | async" class="ticket-card">

      <mat-card-content class="ticket-content">
        <p>{{ ticket.category }}</p>
        <p>{{ ticket.description }}</p>
        <p>{{ ticket.severity_score }}</p>
        <p>{{ ticket.time_active }}</p>
        <p>{{ ticket.created_at }}</p>
        <p>{{ ticket.team.name }}</p>
      </mat-card-content>

    </mat-card>
  </div>

</div>
