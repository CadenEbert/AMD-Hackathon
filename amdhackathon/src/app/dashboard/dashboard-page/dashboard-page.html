<div class="dashboard-container">

  <div class="header">
    <h1 class="h1">Dashboard</h1>


  </div>


  <div class="ticket-filtering">
    <label class="filter-label">
      Sort by:
      <select [(ngModel)]="sortOption" (change)="onSortOptionChange($event)">
        <option value="date">Longest Since Open</option>
        <option value="category">Category</option>
        <option value="severity">Severity Level (Highest to Lowest)</option>
        <option value="severityAsc">Severity Level (Lowest to Highest)</option>
      </select>
    </label>


    <label class="filter-label">
      Filter by Resolved Status:
      <select [(ngModel)]="resolvedFilter" (change)="onResolvedFilterChange($event)">
        <option value="unresolved">Unresolved</option>
        <option value="resolved">Resolved</option>
        <option value="all">All</option>

      </select>
    </label>

  </div>

  <div class="ticket-description">
    <p class="ticket-text">Category</p>
    <p class="ticket-text">Description</p>
    <p class="ticket-text">Severity</p>
    <p class="ticket-text">Time Active</p>
    <p class="ticket-text">Date Created</p>
    <p class="ticket-text">Team Assigned</p>

  </div>



  <div class="tickets">


    <mat-card *ngFor="let ticket of filteredTickets$ | async" class="ticket-card">
      <mat-card-header>
        <mat-card-title>{{ ticket.category }}</mat-card-title>

      </mat-card-header>
      <mat-card-content>
        <p>{{ ticket.description }}</p>

        <div class="severity-bar" [ngClass]="getSeverityClass(ticket.severity_score)">
          <p>Severity Score: {{ ticket.severity_score }}</p>
        </div>

        <p>Time Active: {{ ticket.time_active }}</p>
        <p>Date Created: {{ ticket.created_at }}</p>
      </mat-card-content>

    </mat-card>
  </div>

</div>
