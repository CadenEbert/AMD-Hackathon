<div class="ticket-container">
  <div class="header">
    <h1 class="h1">Create Ticket</h1>

    <div class="nav">
      <a routerLink="/dashboard" class="nav-link">Dashboard</a>
      <a routerLink="/create-team" class="nav-link">Create Team</a>
      <a routerLink="/create-ticket" class="nav-link">Create Ticket</a>
      <a routerLink="/create-category" class="nav-link">Create Category</a>

    </div>




  </div>

  <div class="ticket-content">

    <div class="upload-select">
      <label class="filter-label">
        Upload Type:
        <select [(ngModel)]="uploadType">
          <option value="text">Text</option>
          <option value="audio">Audio</option>
        </select>
      </label>
    </div>



    <div class="ticket-form" *ngIf="uploadType === 'text'">
      <form class="form">


        <h1 class="form-header">Ticket Description</h1>
        <textarea id="description" name="description" [(ngModel)]="ticketDescription"
          class="description-form"></textarea>

        <button (click)="createTicket(1, ticketDescription)" class="submit-button" [disabled]="uploading">
          {{ uploading ? 'Submitting...' : 'Submit Ticket' }}
        </button>
      </form>
    </div>

    <div class="ticket-form" *ngIf="uploadType === 'audio'">
      <form class="audio-form">
        <h1 class="form-header">Upload Audio File</h1>

        <input class="audio-input" type="file" accept="audio/*" (change)="onAudioFileSelected($event)" />
        <p *ngIf="selectedAudioFile">Selected file: {{ selectedAudioFile.name }}</p>

        <button class="submit-button" (click)="createAudioTicket(1, selectedAudioFile)" [disabled]="uploading">
          {{ uploading ? 'Submitting...' : 'Submit Ticket' }}
        </button>
      </form>
    </div>
  </div>
</div>
